ㅓ<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루이의 하루 | LOUIE ARCHIVE</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client v2 (최신 안정 버전) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #fcf9f5;
      --card-bg: #ffffff;
      --text-main: #2c2a29;
      --text-sub: #7a7571;
      --accent: #d4a373;
      --accent-hover: #bc8a5f;
      --border-color: #eee7de;
      --shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--text-main);
    }
    header p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-top: 8px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* 캘린더 컨트롤 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 30px;
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
    }
    .calendar-header h2 {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-sub);
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #f5ede6; color: var(--accent); }

    /* 캘린더 그리드 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .day-header {
      background: #faf6f0;
      text-align: center;
      padding: 12px 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }
    .day-cell {
      min-height: 110px;
      padding: 8px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      position: relative;
      background: #fff;
      transition: background 0.2s;
    }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell:hover { background: #faf6f0; }
    .day-cell.other-month { opacity: 0.3; cursor: default; }
    .day-cell.other-month:hover { background: #fff; }
    .date-num { font-size: 0.85rem; font-weight: 500; color: var(--text-main); }
    
    /* 미디어 썸네일 표시 */
    .thumb-preview {
      margin-top: 6px;
      width: 100%;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
    }
    .media-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #fff;
      width: 90%;
      max-width: 500px;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: none; border: none;
      font-size: 1.2rem; color: var(--text-sub); cursor: pointer;
    }
    .modal-card h3 { font-size: 1.3rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px; font-size: 0.95rem; outline: none;
    }
    .form-group textarea { height: 80px; resize: none; }
    .submit-btn {
      width: 100%; padding: 14px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s; margin-top: 10px;
    }
    .submit-btn:hover { background: var(--accent-hover); }

    /* 모달 내부 기록 뷰어 */
    .view-media {
      width: 100%; height: 260px;
      border-radius: 14px; object-fit: cover;
      margin-bottom: 15px; background: #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>LOUIE ARCHIVE</h1>
    <p>소중한 루이의 순간들을 남기는 감성 공간 🐾</p>
  </header>

  <div class="container">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
      <h2 id="monthTitle">2026. 09</h2>
      <button class="nav-btn" id="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <div class="day-header">SUN</div>
      <div class="day-header">MON</div>
      <div class="day-header">TUE</div>
      <div class="day-header">WED</div>
      <div class="day-header">THU</div>
      <div class="day-header">FRI</div>
      <div class="day-header">SAT</div>
      <!-- 날짜 셀 자바스크립트 생성 -->
    </div>
  </div>

  <!-- 작성 및 상세보기 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modalDateTitle">2026년 9월 16일</h3>
      
      <div id="modalBody">
        <!-- JS로 동적 폼/뷰 생성 -->
      </div>
    </div>
  </div>

  <script>
    /* =========================================
       SUPABASE 연동 설정 (전역 변수 방지)
    ========================================= */
    const SUPABASE_URL = "https://yirlkidrecszximzbauz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpcmxraWRyZWNzenhpbXpiYXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTQ3MjUsImV4cCI6MjEwNDkzMDcyNX0.sjWPU3v_wjSCl7fGuuDPWzVcP4pvUXuwXlu9HOtPZA8";
    
    // v2 클라이언트 초기화
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date();
    let memoriesData = {};
    let selectedDateStr = "";

    // 앱 초기화
    document.addEventListener("DOMContentLoaded", () => {
      fetchMemories();

      document.getElementById("prevMonth").addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });
      document.getElementById("closeModal").addEventListener("click", closeModal);
    });

    // Supabase 데이터 불러오기
    async function fetchMemories() {
      try {
        const { data, error } = await supabaseClient.from('memories').select('*');
        if (error) throw error;
        
        memoriesData = {};
        if (data) {
          data.forEach(item => {
            memoriesData[item.date] = item;
          });
        }
        renderCalendar();
      } catch (err) {
        console.error("데이터 로드 실패:", err.message);
        renderCalendar();
      }
    }

    // 캘린더 그리기
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("monthTitle").innerText = `${year}. ${String(month + 1).padStart(2, '0')}`;

      const grid = document.getElementById("calendarGrid");
      // 헤더 제외 기존 날짜 셀 제거
      const cells = grid.querySelectorAll(".day-cell");
      cells.forEach(c => c.remove());

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      // 이전 달 날짜 채우기
      for (let i = firstDay - 1; i >= 0; i--) {
        const cell = document.createElement("div");
        cell.className = "day-cell other-month";
        cell.innerHTML = `<span class="date-num">${prevLastDate - i}</span>`;
        grid.appendChild(cell);
      }

      // 이번 달 날짜 채우기
      for (let date = 1; date <= lastDate; date++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";
        
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const memory = memoriesData[dateStr];

        let contentHtml = `<span class="date-num">${date}</span>`;
        if (memory && memory.media_url) {
          if (memory.media_type === 'video') {
            contentHtml += `<video src="${memory.media_url}" class="thumb-preview" muted></video>
                            <span class="media-badge"><i class="fa-solid fa-video"></i></span>`;
          } else {
            contentHtml += `<img src="${memory.media_url}" class="thumb-preview">`;
          }
        }

        cell.innerHTML = contentHtml;
        cell.addEventListener("click", () => openModal(dateStr, memory));
        grid.appendChild(cell);
      }
    }

    // 모달 열기
    function openModal(dateStr, memory) {
      selectedDateStr = dateStr;
      document.getElementById("modalDateTitle").innerText = dateStr;
      const modalBody = document.getElementById("modalBody");

      if (memory) {
        // 데이터가 존재하는 경우 : 보기 화면
        let mediaTag = memory.media_type === 'video'
          ? `<video src="${memory.media_url}" class="view-media" controls></video>`
          : `<img src="${memory.media_url}" class="view-media">`;

        modalBody.innerHTML = `
          ${mediaTag}
          <h4 style="font-size:1.1rem; margin-bottom:8px;">${memory.title || '제목 없음'}</h4>
          <p style="color:var(--text-sub); font-size:0.95rem; line-height:1.5;">${memory.caption || ''}</p>
        `;
      } else {
        // 데이터가 없는 경우 : 업로드 폼
        modalBody.innerHTML = `
          <div class="form-group">
            <label>제목</label>
            <input type="text" id="inputTitle" placeholder="오늘 루이와의 추억 제목">
          </div>
          <div class="form-group">
            <label>사진/영상 선택</label>
            <input type="file" id="inputFile" accept="image/*,video/*">
          </div>
          <div class="form-group">
            <label>메모</label>
            <textarea id="inputCaption" placeholder="루이가 한 귀여운 행동들..."></textarea>
          </div>
          <button class="submit-btn" onclick="uploadMemory()">추억 저장하기</button>
        `;
      }

      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    // 업로드 로직
    async function uploadMemory() {
      const title = document.getElementById("inputTitle").value;
      const caption = document.getElementById("inputCaption").value;
      const fileInput = document.getElementById("inputFile");
      const file = fileInput.files[0];

      if (!file) {
        alert("사진이나 영상을 선택해 주세요!");
        return;
      }

      const submitBtn = document.querySelector(".submit-btn");
      submitBtn.innerText = "업로드 중...";
      submitBtn.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${selectedDateStr}_${Date.now()}.${fileExt}`;
        const mediaType = file.type.startsWith('video') ? 'video' : 'image';

        // 1. Storage 업로드
        const { error: storageError } = await supabaseClient.storage
          .from('louie-media')
          .upload(fileName, file);

        if (storageError) throw storageError;

        // 2. Public URL 가져오기
        const { data: urlData } = supabaseClient.storage
          .from('louie-media')
          .getPublicUrl(fileName);

        const mediaUrl = urlData.publicUrl;

        // 3. DB 저장
        const { error: dbError } = await supabaseClient
          .from('memories')
          .insert([{
            date: selectedDateStr,
            title: title,
            caption: caption,
            media_type: mediaType,
            media_url: mediaUrl
          }]);

        if (dbError) throw dbError;

        alert("루이의 추억이 성공적으로 저장되었습니다! 🐾");
        closeModal();
        fetchMemories(); // 캘린더 새로고침
      } catch (err) {
        alert("저장 실패: " + err.message);
        console.error(err);
      } finally {
        submitBtn.innerText = "추억 저장하기";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
